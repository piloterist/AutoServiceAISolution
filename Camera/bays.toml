# Настройки боксов и камер. Пароли здесь НЕ хранятся (см. save_password.py).
# Один бокс = одна камера. Чтобы добавить бокс, скопируйте блоки [[camera]] и [[bay]].

[defaults]
# Часовой пояс цеха: по нему сравниваются рабочие часы цеха (кадр бокса шлётся только в них).
timezone = "Europe/Moscow"
timezone_note = "время событий хранится с часовым поясом компьютера"
# Подтверждение выезда: машина должна пересечь линию ворот на выезд И не вернуться
# в кадр столько секунд. Значение - гипотеза, подберём на реальных заездах.
exit_hold_sec = 20
# Номер ниже этой уверенности OCR не привязывается к заказ-наряду автоматически.
min_plate_confidence = 0.80

# Распознавание номера и определение въезда/выезда (watcher.py). Поля трекера
# (bay_tracker.TrackerConfig) можно переопределить здесь; значения - гипотезы, их подбираем
# на реальных заездах.
[detection]
fps = 3
# Пока бокс пуст и номера в кадре нет - проверяем реже (кадров в секунду): экономит процессор.
# idle_fps = 1
# Как часто присылать свежий кадр бокса на страницу (секунд, по умолчанию 60).
# frame_every_sec = 60
# Проверка выезда кадром: когда номер пропал и выезд пора подтверждать, детектор (YOLOX-s, модель
# скачивается сама) смотрит кадр; машина в боксе - выезд ложный. false = подтверждать только по номеру.
# vehicle_check = true
# vehicle_min_score = 0.25   # уверенность детектора, с которой рамка считается машиной
# vehicle_min_area = 0.10    # доля кадра: меньше - машина вдали у ворот, а не в боксе
# vehicle_empty_checks = 3   # проверок подряд (раз в 2 с) без машины, чтобы подтвердить выезд
# vehicle_back_sec = 30      # машину видим столько секунд - "уезжает" было ложным
# park_min_width = 150   # номер не мельче стольких px (на 4 мм: ~150 px = 6 м, ~330 px = 3 м)
# park_still_sec = 4.0   # сколько секунд машина стоит на месте до подтверждения въезда

[[camera]]
id = "cam1"
ip = "192.168.31.209"
rtsp_port = 554
user = "admin"
stream_path = "/stream1"
model = "TP-Link VIGI C440 4mm"
# Линия ворот в долях кадра (0..1): две точки [x, y]. Пока не размечена.
gate_line = []
# Зона, где ищем номер (многоугольник в долях кадра). Пока не размечена.
plate_zone = []
# Следить за камерой и распознавать номера (узел site_node.py).
detect = true
# Область кадра для детектора номера (доли 0..1: x1, y1, x2, y2). Меньше область - далёкий
# номер крупнее для сети. Подбирается под камеру; пусто = весь кадр.
detect_roi = [0.25, 0.10, 0.80, 0.75]

[[bay]]
id = "bay1"
name = "Бокс 1"
camera_id = "cam1"
enabled = true

# ---- Ворота кузовного цеха (режим "gate") ------------------------------------------------------
# У кузовного нет боксов: одни ворота, машина проезжает под камерой, не останавливаясь. Камера стоит
# перед воротами и смотрит на них. Заезд - номер растёт в кадре и пропадает (машина прошла под
# камерой); выезд - номер появляется крупным и уменьшается. На каждый проезд - одно событие.
# Чтобы включить, раскомментируйте блоки и поправьте ip/код камеры. [[bay]] нужен только чтобы
# связать камеру с воротами в ESP: в ESP у ворот цеха (тип «Ворота») должен быть тот же код камеры.
#
# [[camera]]
# id = "gate1"
# ip = "192.168.31.220"
# rtsp_port = 554
# user = "admin"
# stream_path = "/stream1"
# model = "TP-Link VIGI C440 4mm"
# detect = true
# mode = "gate"
# fps = 6                          # кадров в секунду; проезд длится 1-3 с, меньше 5 не ставьте
# detect_roi = []                  # область кадра для детектора номера (доли 0..1), пусто = весь кадр
# motion_threshold = 0             # >0 включает датчик движения (экономит процессор), напр. 2.0
#
# [[bay]]
# id = "gate1"
# name = "Ворота"
# camera_id = "gate1"
# enabled = true
#
# Настройки следа проезда (в разделе [detection], значения - гипотезы, подберём на проездах):
# gap_sec = 1.5          # столько секунд без номера - проезд закончился
# min_samples = 3        # кадров с номером в проезде, чтобы вообще решать
# grow_ratio = 1.4       # номер вырос во столько раз - въезд
# shrink_ratio = 0.7     # номер уменьшился до такой доли - выезд (между ними: направление неясно)
# min_width = 60         # номер мельче этого (px) не считаем
# read_min_width = 80    # мельче этого номер не читаем (OCR на нём шумит)
# motion_threshold = 0   # то же, что у камеры: среднее изменение серого кадра, 0 = выключено
