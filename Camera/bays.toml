# Настройки боксов и камер. Пароли здесь НЕ хранятся (см. save_password.py).
# Один бокс = одна камера. Чтобы добавить бокс, скопируйте блоки [[camera]] и [[bay]].

[defaults]
# Часовой пояс цеха: по нему сравниваются рабочие часы цеха (кадр бокса шлётся только в них).
timezone = "Europe/Moscow"
timezone_note = "время событий хранится с часовым поясом компьютера"
# Подтверждение выезда: машина должна пересечь линию ворот на выезд И не вернуться
# в кадр столько секунд. Значение - гипотеза, подберём на реальных заездах.
exit_hold_sec = 20
# Номер ниже этой уверенности OCR не привязывается к заказ-наряду автоматически.
min_plate_confidence = 0.80

# Распознавание номера и определение въезда/выезда (watcher.py). Поля трекера
# (bay_tracker.TrackerConfig) можно переопределить здесь; значения - гипотезы, их подбираем
# на реальных заездах.
[detection]
fps = 3
# Пока бокс пуст и номера в кадре нет - проверяем реже (кадров в секунду): экономит процессор.
# idle_fps = 1
# Как часто присылать свежий кадр бокса на страницу (секунд, по умолчанию 60).
# frame_every_sec = 60
# park_min_width = 150   # номер не мельче стольких px (на 4 мм: ~150 px = 6 м, ~330 px = 3 м)
# park_still_sec = 4.0   # сколько секунд машина стоит на месте до подтверждения въезда

[[camera]]
id = "cam1"
ip = "192.168.31.209"
rtsp_port = 554
user = "admin"
stream_path = "/stream1"
model = "TP-Link VIGI C440 4mm"
# Линия ворот в долях кадра (0..1): две точки [x, y]. Пока не размечена.
gate_line = []
# Зона, где ищем номер (многоугольник в долях кадра). Пока не размечена.
plate_zone = []
# Следить за камерой и распознавать номера (узел site_node.py).
detect = true
# Область кадра для детектора номера (доли 0..1: x1, y1, x2, y2). Меньше область - далёкий
# номер крупнее для сети. Подбирается под камеру; пусто = весь кадр.
detect_roi = [0.25, 0.10, 0.80, 0.75]

[[bay]]
id = "bay1"
name = "Бокс 1"
camera_id = "cam1"
enabled = true
