services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    ports:
      # Bound to loopback only - PostgreSQL is never meant to be reachable
      # from outside this host. The backend reaches it over the internal
      # compose network regardless of this port mapping.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
      API_TOKEN: ${API_TOKEN}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REVENUE_STATUSES: ${REVENUE_STATUSES:-}
      ENABLE_YANDEX_RELAY: ${ENABLE_YANDEX_RELAY:-false}
      YANDEX_DISK_OAUTH_TOKEN: ${YANDEX_DISK_OAUTH_TOKEN:-}
      YANDEX_DISK_WATCH_PATH: ${YANDEX_DISK_WATCH_PATH:-/1c-export}
      YANDEX_POLL_INTERVAL_SECONDS: ${YANDEX_POLL_INTERVAL_SECONDS:-300}
      ENABLE_FIVESYSTEMS_LOOKUP: ${ENABLE_FIVESYSTEMS_LOOKUP:-false}
      FIVESYSTEMS_API_BASE_URL: ${FIVESYSTEMS_API_BASE_URL:-https://api.5systems.ru}
      FIVESYSTEMS_USERNAME: ${FIVESYSTEMS_USERNAME:-}
      FIVESYSTEMS_PASSWORD: ${FIVESYSTEMS_PASSWORD:-}
      FIVESYSTEMS_COMPANY_UUID: ${FIVESYSTEMS_COMPANY_UUID:-}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side only - never exposed to the browser (no NEXT_PUBLIC_
      # prefix). Must match whatever backend NEXT_PUBLIC_API_URL points at.
      BACKEND_API_TOKEN: ${BACKEND_API_TOKEN:-${API_TOKEN}}
      # Signs the per-user login session cookie (see frontend/lib/auth.ts) -
      # login/password now come from the backend's users table, not env vars.
      AUTH_SECRET: ${AUTH_SECRET}
      # Docker Desktop on Windows doesn't reliably forward native filesystem
      # change events through a bind mount - without polling, next dev's
      # watcher silently misses edits and keeps serving a stale compiled
      # bundle even though the file on disk (and inside the container) is
      # already up to date.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next_cache:
